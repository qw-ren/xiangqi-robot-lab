name: Vision offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Match the tested legacy ONNX Runtime loader requirements.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      - run: python tools/vision/aruco_image_test.py --self-test --out artifacts/aruco-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aruco-offline-evidence
          path: artifacts/aruco-ci
