<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋对弈台</title>
    <link rel="stylesheet" href="/static/css/style.css?v=board-display-20261126">
</head>
<body>
    <div class="app-shell">
        <header class="header">
            <div class="brand">
                <span class="brand-mark">棋</span>
                <h1>中国象棋对弈台</h1>
            </div>
            <div class="status-bar">
                <span id="connection-status" class="status-indicator disconnected">● 未连接</span>
                <span id="game-status" class="game-status">等待开始</span>
            </div>
        </header>

        <main class="main-content">
            <div class="sidebar">
                <aside class="panel game-information" aria-label="对局与视觉状态">
                    {% if physical_game %}
                    <p id="physical-game-status" role="status">等待确认开局</p>
                    <p id="physical-game-detail" hidden></p>
                    <p id="physical-game-preflight" aria-label="开赛自检"></p>
                    <p id="physical-game-result" role="status" hidden></p>
                    {% endif %}
                    <p id="vision-observation-status" role="status">视觉尚未运行。ArUco 结果将作为观测预览显示。</p>
                    <p id="camera-preview-status" role="status">正在检测可用摄像头…</p>
                </aside>

                <aside class="control-panel panel">
                    <section class="panel-section source-section">
                        <h2>画面输入</h2>
                        <div class="field-stack">
                            <label for="input-source">输入源</label>
                            <select id="input-source" onchange="changeInputSource()">
                                <option value="virtual">虚拟棋盘（不使用摄像头）</option>
                                <option value="camera:0">USB 摄像头（索引 0）</option>
                                <option value="network">网络摄像头</option>
                                <option value="local">本地图片</option>
                            </select>
                        </div>
                        <div id="network-camera-input" class="input-group" style="display: none;">
                            <input type="text" id="network-camera-url" placeholder="http://192.168.1.23:8080 或 rtsp://192.168.1.23:8554/cam">
                            <button id="btn-connect-network" class="btn btn-secondary">连接</button>
                            <button id="btn-disconnect-network" class="btn btn-secondary">断开</button>
                        </div>
                        <div id="local-image-input" class="input-group" style="display: none;">
                            <input type="file" id="local-image-file" accept="image/*" onchange="handleLocalImageUpload(event)">
                        </div>
                        <button id="btn-refresh-cameras" class="btn btn-secondary">扫描／刷新摄像头</button>
                        <button id="btn-camera-check" class="btn btn-secondary">检查摄像头</button>
                    </section>
                </aside>

                <aside class="info-panel">
                    <section class="panel move-history">
                        <div class="section-heading compact">
                            <h2>走法历史</h2>
                        </div>
                        {% if physical_game %}
                        <button id="physical-game-live" class="btn btn-secondary btn-small" type="button" hidden>返回实时</button>
                        <p id="physical-game-replay" hidden></p>
                        {% endif %}
                        <div id="move-list" class="move-list"></div>
                    </section>

                </aside>
            </div>

            <section class="vision-panel">
                <article class="panel camera-section" aria-label="真实画面">
                    <div class="camera-container">
                        <img id="camera-feed" src="" alt="摄像头画面" style="display: none;">
                        <canvas id="camera-view" width="640" height="480"></canvas>
                        <canvas id="board-canvas" width="450" height="500"></canvas>
                    </div>
                    <div class="visible-controls">
                        <button id="btn-capture" class="btn btn-secondary">捕获图像</button>
                        <button id="btn-recognize" class="btn btn-success">开始识别</button>
                    </div>
                </article>

                <article class="panel virtual-section" aria-label="虚拟棋局">
                    <div class="visual-board-container">
                        <canvas id="visual-board" width="520" height="580" aria-label="当前棋局"></canvas>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script>window.CHRO_DESKTOP_SIMULATION = {{ desktop_virtual_input|default(false)|tojson }};</script>
    <script src="/static/js/app.js?v=board-display-20261126"></script>
    <script src="/static/js/full_features.js?v=board-display-20261126"></script>
</body>
</html>
